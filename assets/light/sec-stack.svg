<svg xmlns="http://www.w3.org/2000/svg" width="850" height="76" viewBox="0 0 850 76" fill="none" role="img" aria-label="Stack / Tech stack"><title>Stack / Tech stack</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.p{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.fg{fill:#1c1a17}.mu{fill:#6b645a}.ac{fill:#94601c}.ac2{fill:#7a6a55}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}.fade{animation:fade 1s ease both}.pop{animation:fade .2s linear both}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.65,0,.35,1) both}
.pulse{animation:pulse 2.4s ease-in-out infinite}.blink{animation:blink 1s steps(1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="0" y="46" font-size="18" font-style="italic" class="d ac up">02</text><text x="42" y="48" font-size="34" class="d fg up" style="animation-delay:0.08s">Stack</text><text x="850" y="46" font-size="11" letter-spacing="2.5" text-anchor="end" class="mu up" style="animation-delay:0.16s">TECH STACK</text><path d="M0 64H850" stroke="#ddd6cb" pathLength="1" class="draw"/><path d="M0 64H34" stroke="#94601c" stroke-width="2" pathLength="1" class="draw" style="animation-delay:0.60s"/></svg>