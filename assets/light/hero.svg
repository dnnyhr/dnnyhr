<svg xmlns="http://www.w3.org/2000/svg" width="850" height="384" viewBox="0 0 850 384" fill="none" role="img" aria-label="Danilo Herrera — Fundador &amp; Full-Stack Developer @ Xinocore"><title>Danilo Herrera — Fundador &amp; Full-Stack Developer @ Xinocore</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.fg{fill:#1c1a17}.mu{fill:#6b645a}.ac{fill:#94601c}
