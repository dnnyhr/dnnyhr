<svg xmlns="http://www.w3.org/2000/svg" width="850" height="190" viewBox="0 0 850 190" fill="none" role="img" aria-label="Construyamos algo que resuelva un problema real."><title>Construyamos algo que resuelva un problema real.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.p{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.fg{fill:#1c1a17}.mu{fill:#6b645a}.ac{fill:#94601c}.ac2{fill:#7a6a55}
