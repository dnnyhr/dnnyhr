<svg xmlns="http://www.w3.org/2000/svg" width="850" height="216" viewBox="0 0 850 216" fill="none" role="img" aria-label="En desarrollo: SaaS de cursos, sistema integral para restaurantes, transporte público en tiempo real con LoRa"><title>En desarrollo: SaaS de cursos, sistema integral para restaurantes, transporte público en tiempo real con LoRa</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.fg{fill:#1c1a17}.mu{fill:#6b645a}.ac{fill:#94601c}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}.fade{animation:fade 1s ease both}.pop{animation:fade .2s linear both}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.65,0,.35,1) both}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.rise{animation:rise 1.3s cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rise{from{transform:translateY(120px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.run{animation:run 3.2s cubic-bezier(.6,0,.4,1) infinite}@keyframes run{from{transform:translateX(-54px)}to{transform:translateX(260px)}}</style><defs><clipPath id="tk0"><rect x="0" y="199" width="260" height="2"/></clipPath><clipPath id="tk1"><rect x="290" y="199" width="260" height="2"/></clipPath><clipPath id="tk2"><rect x="580" y="199" width="260" height="2"/></clipPath></defs><path d="M0 1H260" stroke="#1c1a17" pathLength="1" class="draw" style="animation-delay:0.10s"/><text x="0" y="40" font-size="24" font-style="italic" class="d ac up" style="animation-delay:0.10s">I</text>
  <text x="0" y="78" font-size="22" class="d fg up" style="animation-delay:0.18s">SaaS de cursos</text>
  <text x="0" y="136" font-size="13.5" class="fg up" style="animation-delay:0.26s">Plataforma para crear y vender</text><text x="0" y="156" font-size="13.5" class="fg up" style="animation-delay:0.26s">cursos en línea.</text>
  <text x="0" y="178" font-size="12" font-style="italic" class="mu up" style="animation-delay:0.32s">Online course platform.</text>
  <rect x="0" y="199" width="260" height="1" fill="#ddd6cb"/><g clip-path="url(#tk0)"><rect x="0" y="199" width="54" height="2" class="ac run" style="animation-delay:1.00s"/></g>
  <circle cx="256" cy="36" r="3" class="ac pulse" style="animation-delay:0.00s"/><text x="246" y="40" font-size="9.5" letter-spacing="1.6" text-anchor="end" class="m mu fade" style="animation-delay:0.10s">EN CURSO</text><path d="M290 1H550" stroke="#1c1a17" pathLength="1" class="draw" style="animation-delay:0.25s"/><text x="290" y="40" font-size="24" font-style="italic" class="d ac up" style="animation-delay:0.25s">II</text>
  <text x="290" y="78" font-size="22" class="d fg up" style="animation-delay:0.33s">Sistema integral</text><text x="290" y="104" font-size="22" class="d fg up" style="animation-delay:0.33s">para restaurantes</text>
  <text x="290" y="136" font-size="13.5" class="fg up" style="animation-delay:0.41s">Menú autoadministrado por el</text><text x="290" y="156" font-size="13.5" class="fg up" style="animation-delay:0.41s">cliente y delivery independiente.</text>
  <text x="290" y="178" font-size="12" font-style="italic" class="mu up" style="animation-delay:0.47s">Self-service menu &amp; in-house delivery.</text>
  <rect x="290" y="199" width="260" height="1" fill="#ddd6cb"/><g clip-path="url(#tk1)"><rect x="290" y="199" width="54" height="2" class="ac run" style="animation-delay:1.60s"/></g>
  <circle cx="546" cy="36" r="3" class="ac pulse" style="animation-delay:0.50s"/><text x="536" y="40" font-size="9.5" letter-spacing="1.6" text-anchor="end" class="m mu fade" style="animation-delay:0.25s">EN CURSO</text><path d="M580 1H840" stroke="#1c1a17" pathLength="1" class="draw" style="animation-delay:0.40s"/><text x="580" y="40" font-size="24" font-style="italic" class="d ac up" style="animation-delay:0.40s">III</text>
  <text x="580" y="78" font-size="22" class="d fg up" style="animation-delay:0.48s">Transporte público</text><text x="580" y="104" font-size="22" class="d fg up" style="animation-delay:0.48s">en tiempo real</text>
  <text x="580" y="136" font-size="13.5" class="fg up" style="animation-delay:0.56s">Rastreo de unidades con</text><text x="580" y="156" font-size="13.5" class="fg up" style="animation-delay:0.56s">red LoRa de largo alcance.</text>
  <text x="580" y="178" font-size="12" font-style="italic" class="mu up" style="animation-delay:0.62s">Real-time transit tracking via LoRa.</text>
  <rect x="580" y="199" width="260" height="1" fill="#ddd6cb"/><g clip-path="url(#tk2)"><rect x="580" y="199" width="54" height="2" class="ac run" style="animation-delay:2.20s"/></g>
  <circle cx="836" cy="36" r="3" class="ac pulse" style="animation-delay:1.00s"/><text x="826" y="40" font-size="9.5" letter-spacing="1.6" text-anchor="end" class="m mu fade" style="animation-delay:0.40s">EN CURSO</text></svg>