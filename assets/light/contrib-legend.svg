<svg xmlns="http://www.w3.org/2000/svg" width="850" height="64" viewBox="0 0 850 64" fill="none" role="img" aria-label="Cada cuadro es un día de trabajo"><title>Cada cuadro es un día de trabajo</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.fg{fill:#1c1a17}.mu{fill:#6b645a}.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.65,0,.35,1) both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.sq{animation:sq .5s ease both}@keyframes sq{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}.sq{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
 <path d="M0 1H850" stroke="#ddd6cb" pathLength="1" class="draw"/>
 <text x="0" y="34" font-size="17" font-style="italic" class="d fg up" style="animation-delay:.2s">Cada cuadro es un día de trabajo.</text>
 <text x="0" y="54" font-size="12" class="mu up" style="animation-delay:.3s">Every square is a day of work — the snake eats a year of commits.</text>
 <text x="700" y="40" font-size="10" letter-spacing="1.6" text-anchor="end" class="m mu up" style="animation-delay:.4s">MENOS</text>
 <rect x="712" y="29" width="13" height="13" rx="2" fill="#efebe4" class="sq" style="animation-delay:0.50s"/><rect x="730" y="29" width="13" height="13" rx="2" fill="#d6c4ac" class="sq" style="animation-delay:0.58s"/><rect x="748" y="29" width="13" height="13" rx="2" fill="#c0a37c" class="sq" style="animation-delay:0.66s"/><rect x="766" y="29" width="13" height="13" rx="2" fill="#aa814c" class="sq" style="animation-delay:0.74s"/><rect x="784" y="29" width="13" height="13" rx="2" fill="#94601c" class="sq" style="animation-delay:0.82s"/>
 <text x="850" y="40" font-size="10" letter-spacing="1.6" text-anchor="end" class="m mu up" style="animation-delay:.9s">MÁS</text></svg>