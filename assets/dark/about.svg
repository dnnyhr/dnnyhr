<svg xmlns="http://www.w3.org/2000/svg" width="850" height="248" viewBox="0 0 850 248" fill="none" role="img" aria-label="Sobre mí / About"><title>Sobre mí / About</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.fg{fill:#f0ebe3}.mu{fill:#a39d93}.ac{fill:#d6a66a}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}.fade{animation:fade 1s ease both}.pop{animation:fade .2s linear both}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.65,0,.35,1) both}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.rise{animation:rise 1.3s cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rise{from{transform:translateY(120px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="0" y="14" font-size="10.5" letter-spacing="2.5" class="mu fade">EN ESPAÑOL</text><text x="590" y="14" font-size="10.5" letter-spacing="2.5" class="mu fade" style="animation-delay:0.20s">IN ENGLISH</text>
 <text x="-2" y="84" font-size="68" class="d ac up" style="animation-delay:0.10s">S</text>
 <text x="42" y="54" font-size="18.5" class="d fg up" style="animation-delay:0.15s">oy Danilo, fundador de Xinocore y desarrollador</text><text x="42" y="84" font-size="18.5" class="d fg up" style="animation-delay:0.23s">full-stack. Me encanta crear soluciones para</text><text x="0" y="114" font-size="18.5" class="d fg up" style="animation-delay:0.31s">problemas reales: apps offline-first, software de</text><text x="0" y="144" font-size="18.5" class="d fg up" style="animation-delay:0.39s">gestión y hardware con IA que corre en local.</text>
 <path d="M562 30V150" stroke="#3a3631" pathLength="1" class="draw" style="animation-delay:0.40s"/>
 <text x="590" y="52" font-size="13" class="mu up" style="animation-delay:0.35s">I’m Danilo, founder of Xinocore and a</text><text x="590" y="73" font-size="13" class="mu up" style="animation-delay:0.41s">full-stack developer. I love building</text><text x="590" y="94" font-size="13" class="mu up" style="animation-delay:0.47s">solutions for real problems: offline-</text><text x="590" y="115" font-size="13" class="mu up" style="animation-delay:0.53s">first apps, business software and</text><text x="590" y="136" font-size="13" class="mu up" style="animation-delay:0.59s">hardware powered by on-device AI.</text>
 <path d="M0 182H850" stroke="#3a3631" pathLength="1" class="draw" style="animation-delay:0.60s"/><text x="0" y="208" font-size="10" letter-spacing="1.8" class="m mu up" style="animation-delay:0.80s">ROL · ROLE</text><text x="0" y="236" font-size="20" class="d fg up" style="animation-delay:0.85s">Fundador &amp; Full-Stack</text><text x="290" y="208" font-size="10" letter-spacing="1.8" class="m mu up" style="animation-delay:0.90s">ENFOQUE · FOCUS</text><text x="290" y="236" font-size="20" class="d fg up" style="animation-delay:0.95s">Offline-first · Edge AI · IoT</text><text x="580" y="208" font-size="10" letter-spacing="1.8" class="m mu up" style="animation-delay:1.00s">WEB</text><text x="580" y="236" font-size="20" class="d fg up" style="animation-delay:1.05s">xinocore.com</text></svg>