<svg xmlns="http://www.w3.org/2000/svg" width="850" height="158" viewBox="0 0 850 158" fill="none" role="img" aria-label="Estadísticas de GitHub"><title>Estadísticas de GitHub</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}.fg{fill:#1c1a17}.mu{fill:#6b645a}.ac{fill:#94601c}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}.dr{stroke-dasharray:1;animation:dr 1.4s cubic-bezier(.65,0,.35,1) both}
