<svg xmlns="http://www.w3.org/2000/svg" width="850" height="204" viewBox="0 0 850 204" fill="none" role="img" aria-label="Trayectoria / Experience"><title>Trayectoria / Experience</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.d{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.fg{fill:#f0ebe3}.mu{fill:#a39d93}.ac{fill:#d6a66a}.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}.fade{animation:fade 1s ease both}.pop{animation:fade .2s linear both}.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.65,0,.35,1) both}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.6);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M6 30H586" stroke="#3a3631" stroke-width="2" pathLength="1" class="draw"/><path d="M6 30H586" stroke="#d6a66a" stroke-width="2" pathLength="1" class="draw" style="animation-duration:2.4s;animation-delay:0.30s"/><path d="M596 30H850" stroke="#3a3631" stroke-width="2" stroke-dasharray="3 6" class="fade" style="animation-delay:2.40s"/><circle cx="6" cy="30" r="6" fill="#0d1117" stroke="#d6a66a" stroke-width="2" class="pop" style="animation-delay:0.50s"/><text x="0" y="68" font-size="11" letter-spacing="1.5" class="m ac up" style="animation-delay:0.50s">2024</text><text x="0" y="98" font-size="24" class="d fg up" style="animation-delay:0.58s">Xinocore</text><text x="0" y="126" font-size="13.5" class="d fg up" style="animation-delay:0.65s">Fundé Xinocore para crear</text><text x="0" y="146" font-size="13.5" class="d fg up" style="animation-delay:0.70s">software para problemas reales.</text><text x="0" y="174" font-size="12" class="mu up" style="animation-delay:0.75s">Founded Xinocore to build</text><text x="0" y="192" font-size="12" class="mu up" style="animation-delay:0.80s">software for real problems.</text><circle cx="296" cy="30" r="6" fill="#0d1117" stroke="#d6a66a" stroke-width="2" class="pop" style="animation-delay:1.30s"/><text x="290" y="68" font-size="11" letter-spacing="1.5" class="m ac up" style="animation-delay:1.30s">2025</text><text x="290" y="98" font-size="24" class="d fg up" style="animation-delay:1.38s">Inventory by Xinocore</text><text x="290" y="126" font-size="13.5" class="d fg up" style="animation-delay:1.45s">Software de gestión de inventario</text><text x="290" y="146" font-size="13.5" class="d fg up" style="animation-delay:1.50s">para negocios.</text><text x="290" y="174" font-size="12" class="mu up" style="animation-delay:1.55s">Inventory management software</text><text x="290" y="192" font-size="12" class="mu up" style="animation-delay:1.60s">for businesses.</text><circle cx="586" cy="30" r="6" fill="#d6a66a" stroke="#d6a66a" stroke-width="2" class="pop" style="animation-delay:2.10s"/><circle cx="586" cy="30" r="6" stroke="#d6a66a" class="ring" style="animation-delay:2.80s"/><text x="580" y="68" font-size="11" letter-spacing="1.5" class="m ac up" style="animation-delay:2.10s">AHORA · NOW</text><text x="580" y="98" font-size="24" class="d fg up" style="animation-delay:2.18s">Piko</text><text x="580" y="126" font-size="13.5" class="d fg up" style="animation-delay:2.25s">App offline + robot asistente con</text><text x="580" y="146" font-size="13.5" class="d fg up" style="animation-delay:2.30s">IA local para lenguas nativas.</text><text x="580" y="174" font-size="12" class="mu up" style="animation-delay:2.35s">Offline app + local-AI robot for</text><text x="580" y="192" font-size="12" class="mu up" style="animation-delay:2.40s